
name: Tinybird - CI Workflow

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  TINYBIRD_HOST: ${{ secrets.TINYBIRD_HOST }}
  TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '.'
    services:
      tinybird:
        image: tinybirdco/tinybird-local:latest
        ports:
          - 7181:7181
    steps:
      - uses: actions/checkout@v3
      - name: Install Tinybird CLI
        run: curl https://tinybird.co | sh
      - name: Build project
        run: tb build
      - name: Test project
        run: tb test run
      - name: Deployment check
        run: tb --cloud --host ${{ env.TINYBIRD_HOST }} --token ${{ env.TINYBIRD_TOKEN }} deploy --check
      - name: Remove existing Tinybird branch if it exists
        run: tb --cloud --host ${{ env.TINYBIRD_HOST }} --token ${{ env.TINYBIRD_TOKEN }} branch rm ${{ github.ref_name }} --yes || true
      - name: Create Tinybird branch
        run: tb --cloud --host ${{ env.TINYBIRD_HOST }} --token ${{ env.TINYBIRD_TOKEN }} branch create ${{ github.ref_name }}
      - name: Build branch with connections
        run: tb --branch=${{ github.ref_name }} --host ${{ env.TINYBIRD_HOST }} --token ${{ env.TINYBIRD_TOKEN }} build --with-connections --allow-destructive-operations
      - name: Capture Tinybird server logs                                                                                                           
        if: always()                                                                                                                               
        run: |
          CONTAINER=$(docker ps -q --filter "ancestor=tinybirdco/tinybird-local:latest")
          echo "=== Tinybird server log ==="
          docker exec $CONTAINER tail -300 /var/log/tinybird-local-server.log
          echo "=== ClickHouse query log ==="
          docker exec $CONTAINER tail -300 /var/log/clickhouse-server/clickhouse-server.log
      - name: Start vehicle_data datasource
        run: tb --branch=${{ github.ref_name }} --host ${{ env.TINYBIRD_HOST }} --token ${{ env.TINYBIRD_TOKEN }}  datasource start vehicle_data
